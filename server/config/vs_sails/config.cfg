# Empirecraft / Minecraft 1.20.1 / Forge 47.4.23
enable-wind = true
# Wind acts through sails; avoid adding a second wind force to unrelated ships.
enable-aerodynamic-wind = false
no-sail-zone = 90
blow-vanilla-particles = false
sail-power = 25000
forgiving-sails = false
rudder-power = 1.0
realistic-rudder = true
keel-power = 4.0
wheel-interval = 6
air-density = 124.0
# Empirecraft's non-magical rules: use ordinary ballast and buoys.
magic-ballast-righting-force = 0.0
ballast-float-strength = 0.0
buoy-float-strength = 0.125
max-assemble-blocks = 10000
