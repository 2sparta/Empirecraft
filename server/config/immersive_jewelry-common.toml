
#Immersive Smithing. With it installed, jewelry blanks are forged at the Smith's Forge and shaped on the Smith's Anvil,
#and metal quality carries into the finished jewelry.
[immersiveSmithing]
	#Forge jewelry blanks with Immersive Smithing when it is installed.
	enableImmersiveSmithingIntegration = true
	#Never offer crafting-table recipes for blanks, even without Immersive Smithing (for packs that require it).
	requireImmersiveSmithing = false
	#Without the integration, blanks can be crafted from nuggets and ingots at a crafting table.
	enableFallbackBlankRecipes = true
	#Metalwork quality of a crafted (not smithed) blank, 0..1.
	#Range: 0.0 ~ 1.0
	fallbackSmithingQuality = 0.45
	#Immersive Smithing material families (for example "forge:lead") that never become jewelry blanks.
	metalBlacklist = ["forge:lead", "forge:uranium"]

#Where jewelry is worn
[equipment]
	#AUTO: Curios slots when Curios is installed, otherwise the built-in jewelry slots.
	#CURIOS: only Curios (jewelry cannot be worn without it). BUILTIN: always the built-in slots.
	#Allowed Values: AUTO, CURIOS, BUILTIN
	equipmentSystem = "AUTO"

#Gemstones
[gems]
	#Every forge:gems/<name> tag without a gem definition becomes a generic, cuttable gem.
	autoDetectGemTags = true
	#forge:gems/<name> names that are never treated as gemstones.
	autoDetectExclusions = ["prismarine", "coal", "charcoal", "redstone", "glowstone", "experience"]

#Jewelcraft Reforged worlds
[migration]
	#Convert Jewelcraft Reforged jewelry into Immersive Jewelry pieces when it is loaded.
	enableLegacyConversion = true

[debug]
	#Log definition loading, integration activation, conversions and data repairs in detail.
	debugLogging = false

