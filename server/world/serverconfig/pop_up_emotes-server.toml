
#Pop-up Emotes Server Config
[misc]
	#Minimal permission lever required for player to be a moderator. 0 - All players, 3 - Admin, 4 - OP
	#Range: 0 ~ 4
	moderatorPermissionLevel = 3

[data]
	#Allow clients to share their custom emote packs as url links, the server syncs them to other players.
	allowCustomPacks = true
	#The maximum received per-player emote amount.
	#Range: 8 ~ 128
	maxEmoteAmount = 64
	#If true, disables warnings that are sent to players when their emote pack is too large or if the server disallows custom packs.
	disableSystemMessages = false

