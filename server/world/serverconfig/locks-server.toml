#Maximum amount of blocks that can be locked at once
#一次最多可以锁定的方块数量
#Range: > 1
"Max Lockable Volume" = 6
#Blocks that can be locked. Each entry is the mod domain followed by the block's registry name. Can include regular expressions
#可以锁定的方块。每个值由模组域名和块的注册名称组成，可以包含正则表达式。
"Lockable Blocks" = [".*chest", "[a-z0-9_.-]+:wood/(trapped_)?chest/[a-z0-9_/.-]+", ".*barrel", ".*hopper", ".*door", ".*trapdoor", ".*fence_gate", ".*shulker_box", "handcrafted:.*", "timber_joinery:.*", "farmersdelight:([a-z_]+_cabinet|basket|cooking_pot|cutting_board|skillet)", "vinery:([a-z_]+_(cabinet|drawer|shelf|barrel|chair|table)|[a-z_]+_wine_rack_(small|mid|big)|basket|storage_pot)", "meadow:(shelf|cheese_rack|chair|bench|stone_bench|table|stone_table|shutter_block(_[a-z_]+)?|stove_tiles_bench)", "dawnoftimebuilder:[a-z_]+_(chair|couch|footstool|table|shutters)", "decorative_blocks:[a-z_]+_(seat|bench)", "supplementaries:(sack|safe|drawers|item_shelf|lunch_basket|pedestal|urn|jar(_tinted)?|crystal_display|globe(_sepia)?|notice_board|blackboard|(trapped_)?present(_[a-z_]+)?)", "medieval_deco:(barrel_mod|barrel_water|fish_barrel|fish_barrel_salmon)", "chipped:(botanist_workbench|glassblower|carpenters_table|loom_table|mason_table|alchemy_bench|tinkering_table)", "etched:(etching_table|album_jukebox|radio)"]
#Open locks can be removed with an empty hand while sneaking
#在潜行状态下，可以用空手移除打开的锁。
"Allow Removing Locks" = true
#Locked blocks cannot be destroyed in survival mode
#在生存模式中，锁定的块无法被破坏。
"Protect Lockables" = true
#Lock blocks with just one click! It's magic! (Cancel will probably fail spectacularly with custom doors, custom double chests, etc)
#只需点击一下即可锁定块！这太神奇了！ （取消可能会使自定义门、自定义双箱等出现严重错误）
"Easy Lock" = true
#Use stronger checks to prevent blocks on locks from being broken, but its compatibility is unknown
#使用更强的检查来防止上锁方块被破坏，兼容性未知
"Stronger Prevention" = false

