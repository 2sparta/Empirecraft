      - Тестовый заголовок в мире 'test'
      footer:
      - Тестовый футер в мире 'test'
    default:
      header:
      - <#FFFFFF>&m                                                </#FFFF00>
      - '&x&F&6&F&F&5&AE&x&F&6&E&1&5&3m&x&F&6&C&4&4&Cp&x&F&6&A&6&4&4i&x&F&6&8&8&3&Dr&x&E&F&7&8&3&9e&x&E&7&6&8&3&6C&x&E&0&5&8&3&2r&x&D&9&4&7&2&Ea&x&D&1&3&7&2&Bf&x&C&A&2&7&2&7t'
