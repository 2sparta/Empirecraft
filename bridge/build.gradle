plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '1.8.1'
group = 'ua.empirecraft'
base.archivesName = 'empirecraft-towny-journeymap'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { empirecraft_townymap { source sourceSets.main } }
        }
    }
}
repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'info.journeymap' }
    }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    compileOnly files('../mods/chatplus-forge-2.8.1-empirecraft.2.jar')
    compileOnly fg.deobf('info.journeymap:journeymap-api-forge:1.20.1-2.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}






tasks.named('jar', Jar) { manifest.attributes('MixinConfigs': 'empirecraft-client.mixins.json,empirecraft-contact.mixins.json') }

sourceSets {
    contactSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('contactSmokeJar', Jar) {
    archiveFileName = 'empirecraft-contact-smoke.jar'
    from sourceSets.contactSmoke.output
    finalizedBy 'reobfContactSmokeJar'
}
reobf { contactSmokeJar {} }

