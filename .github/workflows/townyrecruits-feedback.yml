name: TownyRecruits feedback regression and native build
on:
  pull_request:
    paths:
      - 'towny-recruits/**'
      - '.github/workflows/townyrecruits-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            towny-recruits
            ship-cannons
            server/libraries
            server/mods
            server/plugins
            server/config/admanticheat/idfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and JDK regression checks
        run: |
          python3 -m py_compile towny-recruits/build_unified.py towny-recruits/smoke_unified.py towny-recruits/package_feedback.py towny-recruits/test_feedback.py
          python3 towny-recruits/test_feedback.py
      - name: Durable ledger and migration
        run: |
          curl --fail --location --output /tmp/gson-2.10.jar https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10/gson-2.10.jar
          python3 towny-recruits/test_ledger.py --gson /tmp/gson-2.10.jar
      - name: Build against real installed APIs
        run: python3 towny-recruits/build_unified.py --server-home server
      - name: Native Towny, Recruits, provisions and restart
        run: python3 towny-recruits/smoke_unified.py --server-home server --reset-world
      - name: Package matching client, server and ADM
        run: python3 towny-recruits/package_feedback.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TownyRecruits-2.0.1
          path: towny-recruits/dist/2.0.1/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TownyRecruits-feedback-logs
          path: towny-recruits/build/native-test/*.log
          if-no-files-found: ignore
