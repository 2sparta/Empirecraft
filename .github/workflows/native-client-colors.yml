name: Fix native Registrate client colors
on:
  push:
    branches: [codex/fix-registrate-client-colors]
    paths: ['native-content/**', '.github/workflows/native-client-colors.yml']
permissions:
  contents: read
concurrency:
  group: native-client-colors-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native-content/
            /mods/
            /server/mods/
            /modpack-lock.json
            /seasonal-calendar/installed-mods.json
            /seasonal-calendar/audit/coverage.json
            /forging-balance/installed-client-mods.json
            /medieval-create/update_adm.py
            /server/config/admanticheat/idfile/admanticheat_id_list.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproduce client callback regression on JVM
        run: python3 native-content/test_client_colors.py
      - name: Patch installed JARs and refresh integrity metadata
        run: |
          python3 native-content/client_colors.py
          python3 native-content/update_metadata.py
          python3 native-content/update_metadata.py --check
      - name: Package changed client and server files
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          changes=json.loads(Path('native-content/audit/client-colors.json').read_text())
          metadata=['native-content/audit/client-colors.json','native-content/audit/build.json','modpack-lock.json','seasonal-calendar/installed-mods.json','seasonal-calendar/audit/coverage.json','forging-balance/installed-client-mods.json','server/config/admanticheat/idfile/admanticheat_id_list.json']
          with zipfile.ZipFile('Empirecraft-Client-Colors-Fix.zip','w',zipfile.ZIP_DEFLATED) as output:
              for name in sorted(changes):
                  output.write(name,name)
                  output.write(name+'.sha256',name+'.sha256')
              for name in metadata:output.write(name,name)
              output.writestr('INSTALL.txt','Замініть JAR з папки mods на клієнті, а server/mods — на сервері. Збережіть назви файлів і видаліть дублікати старих JAR. Конфіг ADM беріть із цього архіву лише якщо він відповідає встановленій збірці. Потрібен повний перезапуск.\nПеревірено ASM і поведінку відкладених обробників у JVM; повний графічний клієнт не запускався.\n')
          PY
      - name: Save patched binaries and matching integrity records
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- native-content/audit mods server/mods modpack-lock.json seasonal-calendar/installed-mods.json seasonal-calendar/audit/coverage.json forging-balance/installed-client-mods.json server/config/admanticheat/idfile/admanticheat_id_list.json
          if ! git diff --cached --quiet; then
            git commit -m 'Patch installed Registrate client color listeners and integrity records'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Empirecraft-Client-Colors-Fix
          path: Empirecraft-Client-Colors-Fix.zip
          if-no-files-found: error
