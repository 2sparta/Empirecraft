name: Verify and package state debug commands
on:
  push:
    branches: [codex/towny-state-debug]
    paths: ['feudal/src/**', 'feudal/build.py', 'feudal/package_politics.py', 'feudal/STATE-DEBUG.md', '.github/workflows/state-debug.yml']
  pull_request:
    paths: ['feudal/src/**', 'feudal/build.py', '.github/workflows/state-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: state-debug-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /feudal/
            /server/plugins/empirecraft-feudal-1.6.0.jar*
            /server/mods/empirecraft-towny-journeymap-1.3.0.jar*
            /validation/politics-1.4.0.md
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile plugin and run all H2 and command regression tests
        run: python3 feudal/build.py
      - name: Package server update and debug instructions
        run: python3 feudal/package_politics.py
      - uses: actions/upload-artifact@v4
        with:
          name: towny-state-debug-server
          path: |
            server/plugins/empirecraft-feudal-1.6.0.jar*
            feudal/dist/EmpireCraft-Feudal-1.6.0-server.zip*
            feudal/STATE-DEBUG.md
          if-no-files-found: error
  save-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/towny-state-debug' && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /server/plugins/empirecraft-feudal-1.6.0.jar*
            /feudal/dist/EmpireCraft-Feudal-1.6.0-server.zip*
      - uses: actions/download-artifact@v4
        with:
          name: towny-state-debug-server
      - name: Save verified binaries to the feature branch
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo 'The branch changed during verification; leave its newer commit untouched.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/plugins/empirecraft-feudal-1.6.0.jar server/plugins/empirecraft-feudal-1.6.0.jar.sha256
          git add -f -- feudal/dist/EmpireCraft-Feudal-1.6.0-server.zip feudal/dist/EmpireCraft-Feudal-1.6.0-server.zip.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Package verified Towny state debug commands'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
