name: Verify and package state debug commands
on:
  push:
    branches: [codex/towny-state-debug]
    paths: ['feudal/src/**', 'feudal/build.py', 'feudal/STATE-DEBUG.md', '.github/workflows/state-debug.yml']
  pull_request:
    paths: ['feudal/src/**', 'feudal/build.py', '.github/workflows/state-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: state-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /feudal/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile current plugin and verify all state, command and H2 regressions
        run: python3 feudal/ci_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: towny-state-debug-server
          path: |
            server/plugins/empirecraft-feudal-1.13.0.jar*
            feudal/STATE-DEBUG.md
            feudal/COMMAND-LANGUAGES.md
            feudal/COMMAND-ALIASES.tsv
          if-no-files-found: error
