name: Verify ChatPlus preferences and channel privacy
on:
  pull_request:
    paths: ['chat-channels/**', 'mods/chatplus-*', 'bridge/src/**', '.github/workflows/chat-channels.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chat-channels/
            /sails/
            /bridge/
            /towny-recruits/src/test/java/guardtest/
            /mods/
            /server/mods/
            /server/libraries/
            /server/plugins/empirecraft-chat-1.1.0.jar*
            /modpack-lock.json
            /forging-balance/installed-client-mods.json
            /seasonal-calendar/installed-mods.json
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /native-content/
            /validation/chatplus-1.2.0.json
            /pack-fixes/
            /layered-armor/README.md
            /mods/empirecraft-layered-armor-*.jar*
            /server/mods/empirecraft-layered-armor-*.jar*
            /kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /server/kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /kubejs/data/minecraft/tags/
            /server/kubejs/data/minecraft/tags/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install Pillow==11.3.0 PyYAML==6.0.3
      - name: Prepare pinned client SDK and preserve unrelated installed Sails artifacts
        run: |
          python3 sails/build.py --sails-only
          git restore -- mods/vs_sails-*.jar* server/mods/vs_sails-*.jar*
      - name: Build and verify preferences, privacy and native input fallback
        run: |
          python3 chat-channels/build.py --client-only
          python3 chat-channels/test.py
          python3 bridge/test_interactive_mixin.py
          python3 chat-channels/update_metadata.py --check
          python3 chat-channels/package.py
      - name: Verify committed client binary is reproducible
        run: git diff --exit-code -- mods/chatplus-forge-2.8.1-empirecraft.3.jar mods/chatplus-forge-2.8.1-empirecraft.3.jar.sha256 server/plugins/empirecraft-chat-1.1.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: chatplus-preferences-verified
          path: |
            chat-channels/dist/Empirecraft-ChatPlus-1.2.0*.zip*
            chat-channels/build/test-results.txt
            validation/chatplus-1.2.0.json
          if-no-files-found: error
