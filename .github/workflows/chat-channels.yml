name: Verify ChatPlus channels and server privacy
on:
  pull_request:
    paths: ['chat-channels/**', 'feudal/**', 'mods/chatplus-*', 'server/plugins/empirecraft-chat-*', '.github/workflows/chat-channels.yml']
  push:
    branches: [codex/chatplus-channels-20261025, codex/chatplus-inline-labels-20261026]
    paths: ['chat-channels/**', 'feudal/**', 'translations/**', '.github/workflows/chat-channels.yml']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chat-channels/
            /mods/empirecraft-towny-journeymap-*.jar*
            /server/mods/empirecraft-towny-journeymap-*.jar*
            /bridge/
            /feudal/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /provisions/
            /titles/catalog.json
            /mods/
            /server/mods/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /server/plugins/LuckPerms-Bukkit-5.5.36.jar
            /server/plugins/empirecraft-feudal-1.13.0.jar*
            /server/plugins/empirecraft-chat-*.jar*
            /modpack-lock.json
            /forging-balance/
            /seasonal-calendar/
            /server/config/sereneseasons/
            /config/sereneseasons/
            /medieval-create/update_adm.py
            /validation/seasonal-calendar.json
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /validation/politics-1.4.0.md
            /validation/chatplus-1.1.0.json
            /translations/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m pip install Pillow==11.3.0 PyYAML==6.0.3
      - name: Test the full existing Feudal suite and current chat title lookup
        run: |
          python3 feudal/ci_build.py
          python3 provisions/test.py
          python3 feudal/package_politics.py
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Build exact upstream patch and test routing and real wire components
        run: |
          python3 chat-channels/build.py
          python3 chat-channels/test.py
          python3 chat-channels/update_metadata.py
          python3 chat-channels/update_metadata.py --check
          python3 chat-channels/package.py
      - name: Export verified installers for the current PR
        uses: actions/upload-artifact@v4
        with:
          name: chatplus-current-installers
          path: |
            chat-channels/dist/
            feudal/dist/EmpireCraft-Feudal-1.13.0-server.zip*
            validation/chatplus-1.1.0.json
          if-no-files-found: error
      - name: Verify all installed Ukrainian and Russian translations
        run: |
          python3 translations/scan.py
          python3 translations/review.py
          python3 translations/build.py
      - name: Save verified current installers on the PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/bombs-reserve-40s' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PACKAGE_BRANCH: codex/bombs-reserve-40s
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          git add -- chat-channels/dist/Empirecraft-ChatPlus-1.1.0.zip chat-channels/dist/Empirecraft-ChatPlus-1.1.0.zip.sha256 chat-channels/dist/Empirecraft-ChatPlus-1.1.0-sources.zip chat-channels/dist/Empirecraft-ChatPlus-1.1.0-sources.zip.sha256
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified ChatPlus installers for PR 70'
            git push origin "HEAD:$PACKAGE_BRANCH"
          fi
      - name: Check committed reproducible artifacts
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- mods/chatplus-forge-2.8.1-empirecraft.2.jar mods/chatplus-forge-2.8.1-empirecraft.2.jar.sha256 server/plugins/empirecraft-chat-1.1.0.jar server/plugins/empirecraft-chat-1.1.0.jar.sha256 server/plugins/empirecraft-feudal-1.13.0.jar server/plugins/empirecraft-feudal-1.13.0.jar.sha256 chat-channels/dist feudal/dist validation/chatplus-1.1.0.json
      - name: Save verified installation artifacts and refreshed language audits
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- translations/upstream translations/audit translations/pack modpack-lock.json forging-balance/installed-client-mods.json server/config/admanticheat/idfile/admanticheat_id_list.json validation/chatplus-1.1.0.json validation/seasonal-calendar.json
          git add -f -- translations/dist chat-channels/dist feudal/dist forging-balance/dist seasonal-calendar/dist mods/chatplus-forge-2.8.1-empirecraft.2.jar mods/chatplus-forge-2.8.1-empirecraft.2.jar.sha256 server/plugins/empirecraft-chat-1.1.0.jar server/plugins/empirecraft-chat-1.1.0.jar.sha256 server/plugins/empirecraft-feudal-1.13.0.jar server/plugins/empirecraft-feudal-1.13.0.jar.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Package verified ChatPlus channels and server title integration'
            git push origin HEAD:${{ github.ref_name }}
          fi
