name: JourneyMap dependency compatibility
on:
  pull_request:
    paths: ['towny-recruits/src/main/resources/META-INF/mods.toml', 'towny-recruits/tools/test_journeymap_version.py', 'mods/townyrecruits-*.jar*', 'mods/journeymap-*.jar*', '.github/workflows/journeymap-version.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /towny-recruits/src/main/resources/META-INF/mods.toml
            /towny-recruits/tools/test_journeymap_version.py
            /mods/townyrecruits-*.jar
            /server/mods/townyrecruits-*.jar
            /mods/journeymap-forge-*.jar
            /server/libraries/org/apache/maven/maven-artifact/
            /server/libraries/org/apache/commons/commons-lang3/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 towny-recruits/tools/test_journeymap_version.py
