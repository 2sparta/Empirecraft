name: Verify native content trim
on:
  push:
    branches: [codex/content-trim]
    paths: ['content-trim/**', '.github/workflows/content-trim.yml']
  pull_request:
    paths: ['content-trim/**', 'mods/*empirecraft.*.jar*', 'server/mods/*empirecraft.*.jar*', 'server/mods/empirecraft-content-trim-*', '.github/workflows/content-trim.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native-content/
            /mods/
            /server/mods/
            /content-trim/
            /end-removal/
            /mods/*no-end*.jar*
            /server/mods/*no-end*.jar*
            /seasonal-leaves/prepare_runtime.py
            /seasonal-leaves/toolchain.py
            /sails/build-inputs.json
            /sails/tools/CreateMappings.java
            /mods/*empirecraft.*.jar*
            /server/mods/*empirecraft.*.jar*
            /server/mods/empirecraft-content-trim-*
            /server/mods/architectury-*
            /server/mods/cloth-config-*
            /server/mods/resourcefullib-*
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /modpack-lock.json
            /seasonal-calendar/
            /medieval-create/update_adm.py
      # Native content is the final overlay; rebuilding a historical stage would restore retired content.
      - name: Verify the final native overlay and preserved earlier features
        id: native
        run: |
          if [ -f native-content/inputs.json ]; then
            python3 native-content/test.py
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.native.outputs.active != 'true' && (hashFiles('end-removal/inputs.json') == '')
        with:
          ref: 84f368498fd2c181aafa1a720bd239f61ec9ad6b
          path: .trim-upstream
          filter: blob:none
          sparse-checkout: server/mods
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        if: steps.native.outputs.active != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare reviewed dependencies and verify native removal plus world migration
        if: steps.native.outputs.active != 'true'
        run: |
          if [ -f end-removal/inputs.json ]; then
            python3 end-removal/verify_legacy.py
            exit 0
          fi
          cp server/mods/architectury-*.jar server/mods/cloth-config-*.jar server/mods/resourcefullib-*.jar .trim-upstream/server/mods/
          python3 content-trim/verify.py --upstream .trim-upstream/server/mods
          sha256sum content-trim/dist/* > /tmp/trim-before.sha256
          python3 content-trim/package.py
          sha256sum content-trim/dist/* > /tmp/trim-after.sha256
          diff -u /tmp/trim-before.sha256 /tmp/trim-after.sha256
          git diff --exit-code -- content-trim mods server/mods modpack-lock.json seasonal-calendar server/config/admanticheat/idfile/admanticheat_id_list.json ':(exclude)content-trim/dist/**'


