name: Check installed release artifacts
on:
  pull_request:
    paths:
      - 'mods/**'
      - 'server/mods/**'
      - 'server/plugins/TownyRecruitsBridge*'
      - 'server/config/admanticheat/idfile/**'
      - 'create-posters/dist/**'
      - 'seasonal-leaves/dist/**'
      - 'towny-recruits/dist/**'
      - 'disabled-mods/replaced-2026-11-01/**'
      - 'disabled-mods/startup-fixes-1/**'
      - 'modpack-lock.json'
      - 'strategy-map/build_recruits_compat.py'
      - 'strategy-map/check_recruits_compat.py'
      - 'strategy-map/tools/ForgeRecruitsDependencyProbe.java'
      - 'ship-cannons/release.py'
      - 'validation/check_installed_releases.py'
      - 'validation/reconcile_modpack.py'
      - 'validation/installed-releases-2026-11-01.json'
      - '.github/workflows/installed-releases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /survival-overhaul/dist/Empirecraft-Survival-Update-1-sources.zip
            /survival-overhaul/dist/*.jar*
            /survival-overhaul/README.md
            /survival-overhaul/defaults/
            /mods/legendarysurvivaloverhaul-*.jar*
            /server/mods/legendarysurvivaloverhaul-*.jar*
            /mods/
            /server/mods/
            /server/plugins/TownyRecruitsBridge*
            /server/config/admanticheat/idfile/
            /create-posters/dist/create-drafting-posters-1.20.1-1.4.0.jar*
            /seasonal-leaves/dist/1.3.1/empirecraft-seasonal-leaves-1.3.1.jar*
            /pack-fixes/dist/empirecraft-pack-fixes-1.0.0.jar*
            /naval/dist/fleet-fixes-1.1/
            /towny-recruits/dist/2.0.0/TownyRecruits.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /strategy-map/dist/recruits-1.20.1-1.15.2-empirecraft.1.jar
            /layered-armor/dist/
            /disabled-mods/replaced-2026-11-01/
            /disabled-mods/startup-fixes-1/
            /modpack-lock.json
            /ship-cannons/release.py
            /validation/check_installed_releases.py
            /validation/reconcile_modpack.py
            /validation/installed-releases-2026-11-01.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python validation/check_installed_releases.py
      - run: python validation/reconcile_modpack.py

  recruits-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /strategy-map/build_recruits_compat.py
            /strategy-map/check_recruits_compat.py
            /strategy-map/dist/recruits-1.20.1-1.15.2-empirecraft.1.jar
            /strategy-map/tools/ForgeRecruitsDependencyProbe.java
            /mods/recruits-*.jar
            /mods/empirecraft-towny-journeymap-*.jar
            /mods/journeymap-forge-*.jar
            /server/mods/recruits-*.jar
            /server/libraries/com/electronwill/night-config/
            /server/libraries/com/google/code/gson/
            /server/libraries/com/google/guava/
            /server/libraries/com/mojang/logging/
            /server/libraries/cpw/mods/
            /server/libraries/net/minecraftforge/
            /server/libraries/org/apache/commons/commons-lang3/
            /server/libraries/org/apache/logging/log4j/
            /server/libraries/org/apache/maven/maven-artifact/
            /server/libraries/org/ow2/asm/
            /server/libraries/org/slf4j/slf4j-api/
            /server/libraries/org/spongepowered/mixin/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 strategy-map/check_recruits_compat.py
