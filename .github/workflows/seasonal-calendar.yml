name: Verify seasonal calendar
on:
  pull_request:
    paths:
      - 'seasonal-calendar/**'
      - 'mods/empirecraft-calendar-*.jar*'
      - 'server/mods/**'
      - 'server/config/sereneseasons/**'
      - 'config/sereneseasons/**'
      - 'ship-cannons/release.json'
      - 'ore-retrogen/release.json'
      - 'seasonal-leaves/release.json'
      - 'recipe-whales/release.json'
      - 'spawn-native/release.json'
      - 'drinks-balance/release.json'
      - '.github/workflows/seasonal-calendar.yml'
  push:
    branches: ['codex/seasonal-calendar']
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /survival-overhaul/dist/Empirecraft-Survival-Update-1-sources.zip
            /survival-overhaul/dist/*.jar*
            /survival-overhaul/README.md
            /survival-overhaul/defaults/
            /mods/legendarysurvivaloverhaul-*.jar*
            /server/mods/legendarysurvivaloverhaul-*.jar*
            /layered-armor/dist/*.jar*
            /naval/dist/fleet-fixes-1.1/*.jar*
            /towny-recruits/dist/2.0.0/TownyRecruits.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /pack-fixes/
            /layered-armor/README.md
            /mods/empirecraft-layered-armor-*.jar*
            /server/mods/empirecraft-layered-armor-*.jar*
            /kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /server/kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /kubejs/data/minecraft/tags/
            /server/kubejs/data/minecraft/tags/
            /mods/empirecraft-seasonal-leaves-*.jar*
            /native-content/
            /sails/smoke-runtime.json
            /mods/
            /forging-balance/installed-client-mods.json
            /seasonal-calendar/
            /translations/dist/
            /ship-cannons/release.json
            /ore-retrogen/release.json
            /seasonal-leaves/release.json
            /recipe-whales/release.json
            /spawn-native/release.json
            /drinks-balance/release.json
            /mods/empirecraft-calendar-*.jar*
            /server/mods/
            /server/libraries/
            /server/config/sereneseasons/
            /config/sereneseasons/
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /modpack-lock.json
            /medieval-create/update_adm.py
            /world-rules/src/main/java/ua/empirecraft/worldrules/RulesConfig.java
            /validation/seasonal-calendar.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify committed native resources and calendar inventory
        run: |
          python3 native-content/test.py
          python3 native-content/update_metadata.py --check
          python3 seasonal-calendar/update_metadata.py --check
      - name: Compile the current calendar and verify years, commands, persistence and both client/server Mixins
        run: |
          python3 seasonal-calendar/build.py
          python3 seasonal-calendar/test.py
          python3 seasonal-calendar/update_metadata.py --check
          git diff --exit-code -- mods/empirecraft-calendar-*.jar* server/mods/empirecraft-calendar-*.jar* seasonal-calendar/dist/native-inputs/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify administrator edits and UTC continuity across a real server restart
        run: python3 seasonal-calendar/smoke.py
      - name: Verify installation package
        run: python3 seasonal-calendar/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: calendar-years-verification
          path: |
            seasonal-calendar/build/*.log
            seasonal-calendar/build/native/
            seasonal-calendar/dist/*1.2.0.zip*
          if-no-files-found: warn
