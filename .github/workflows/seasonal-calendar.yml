name: Verify seasonal calendar
on:
  pull_request:
    paths:
      - 'seasonal-calendar/**'
      - 'mods/empirecraft-calendar-*.jar*'
      - 'server/mods/**'
      - 'server/config/sereneseasons/**'
      - 'config/sereneseasons/**'
      - 'ship-cannons/release.json'
      - 'ore-retrogen/release.json'
      - 'seasonal-leaves/release.json'
      - 'spawn-native/release.json'
      - '.github/workflows/seasonal-calendar.yml'
  push:
    branches: ['codex/seasonal-calendar']
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seasonal-calendar/
            /ship-cannons/release.json
            /ore-retrogen/release.json
            /seasonal-leaves/release.json
            /spawn-native/release.json
            /mods/empirecraft-calendar-*.jar*
            /server/mods/
            /server/libraries/
            /server/config/sereneseasons/
            /config/sereneseasons/
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /modpack-lock.json
            /medieval-create/update_adm.py
            /world-rules/src/main/java/ua/empirecraft/worldrules/RulesConfig.java
            /validation/seasonal-calendar.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit every installed server mod
        run: python3 seasonal-calendar/make_data.py --check --jars server/mods --release ship-cannons/release.json --release ore-retrogen/release.json --release seasonal-leaves/release.json --release seasonal-calendar/releases/leaves-1.2.0.json --release spawn-native/release.json
      - name: Compile and verify native Mixin targets
        run: |
          python3 seasonal-calendar/build.py
          python3 seasonal-calendar/test.py
      - name: Check ADM and the reproducible package
        run: |
          python3 seasonal-calendar/update_metadata.py --check
          python3 seasonal-calendar/update_adm.py --check --id-file server/config/admanticheat/idfile/admanticheat_id_list.json --jar mods/empirecraft-calendar-1.1.1.jar
          python3 seasonal-calendar/package.py
          git diff --exit-code

