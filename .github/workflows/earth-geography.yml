name: Validate Earth geography candidate
on:
  pull_request:
    paths: ['earth-geography/**', '.github/workflows/earth-geography.yml']
  push:
    paths: ['earth-geography/**', '.github/workflows/earth-geography.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /earth-geography/
            /ore-retrogen/toolchain.py
            /sails/build-inputs.json
            /sails/tools/CreateMappings.java
            /seasonal-calendar/src/test/java/guardtest/OfflineMixinService.java
            /seasonal-calendar/src/test/java/guardtest/OfflineProperties.java
            /server/libraries/
            /mods/SereneSeasons-forge-1.20.1-9.1.0.3.jar
            /mods/TerraFirmaCraft-Forge-1.20.1-3.2.30-empirecraft.3.jar
            /mods/empirecraft-calendar-1.2.3.jar
            /mods/empirecraft-tfc-integration-1.0.3.jar
            /mods/journeymap-forge-1.20.1-6.0.7.jar
            /server/mods/empirecraft-ore-retrogen-1.1.1.jar
            /server/mods/empirecraft-fauna-1.2.0.jar
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check configuration and read-only world audit
        run: |
          python earth-geography/make_defaults.py
          git diff --exit-code -- earth-geography/src/main/resources/earth-defaults.json
          python -m unittest discover -s earth-geography/tests -p 'test_*.py'
      - name: Build isolated candidate and verify exact installed Mixin targets
        run: |
          python ore-retrogen/toolchain.py /tmp/earth-sdk server
          python earth-geography/build.py --sdk /tmp/earth-sdk
          python earth-geography/test.py
      - uses: actions/upload-artifact@v4
        with:
          name: earth-geography-candidate
          path: earth-geography/build/libs/*
