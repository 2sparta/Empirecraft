name: Validate Earth geography and regional soils

on:
  pull_request:
    paths:
      - 'earth-geography/**'
      - 'tfc-integration/src/main/java/ua/empirecraft/tfc/RegionalSoil*.java'
      - '.github/workflows/earth-geography.yml'
  push:
    paths:
      - 'earth-geography/**'
      - 'tfc-integration/src/main/java/ua/empirecraft/tfc/RegionalSoil*.java'
      - '.github/workflows/earth-geography.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /earth-geography/
            /tfc-integration/src/main/
            /ore-retrogen/toolchain.py
            /sails/build-inputs.json
            /sails/tools/CreateMappings.java
            /server/libraries/
            /mods/TerraFirmaCraft-*.jar
            /mods/empirecraft-calendar-*.jar
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check configuration and read-only world audit
        run: |
          python earth-geography/make_defaults.py
          git diff --exit-code -- earth-geography/src/main/resources/earth-defaults.json
          python -m unittest discover -s earth-geography/tests -p 'test_*.py'
      - name: Build and check the regional soil release
        run: |
          base_ref=826e520b6830bf9d76ede485698f0fcfa120150d
          git fetch --no-tags --depth=1 origin "$base_ref"
          mkdir -p /tmp/earth-baseline
          for file in empirecraft-earth-0.1.1.jar empirecraft-tfc-integration-1.0.8.jar; do
            git show "$base_ref:mods/$file" > "/tmp/earth-baseline/$file"
          done
          python ore-retrogen/toolchain.py /tmp/earth-sdk server
          python earth-geography/build_regional_soils.py --sdk /tmp/earth-sdk --jdk "$JAVA_HOME" --libraries server/libraries --base-dir /tmp/earth-baseline --output /tmp/earth-release
      - uses: actions/upload-artifact@v4
        with:
          name: earth-regional-soil-release
          path: /tmp/earth-release/
