name: Validate one-time map ores
on:
  push:
    paths: ['ore-retrogen/**', 'mods/sulfur_gunpowder-*', 'server/mods/sulfur_gunpowder-*', 'server/mods/empirecraft-ore-retrogen-*', 'server/config/empirecraft_ore_retrogen-common.toml', '.github/workflows/ore-retrogen.yml']
  pull_request:
    paths: ['ore-retrogen/**', 'mods/sulfur_gunpowder-*', 'server/mods/sulfur_gunpowder-*', 'server/mods/empirecraft-ore-retrogen-*', 'server/config/empirecraft_ore_retrogen-common.toml', '.github/workflows/ore-retrogen.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ore-retrogen/
            /sails/build-inputs.json
            /sails/tools/CreateMappings.java
            /server/libraries/
            /mods/sulfur_gunpowder-1.0.0-forge-1.20.1.jar*
            /server/mods/sulfur_gunpowder-1.0.0-forge-1.20.1.jar*
            /server/mods/empirecraft-ore-retrogen-*.jar*
            /server/config/empirecraft_ore_retrogen-common.toml
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check quotas, old chunks and actual capability persistence
        run: |
          python ore-retrogen/test.py
          python ore-retrogen/build.py
          python ore-retrogen/state_test.py
          python ore-retrogen/build.py --fixture
      - name: Refresh server update and pins
        run: |
          rm -f server/mods/empirecraft-ore-retrogen-1.0.0.jar server/mods/empirecraft-ore-retrogen-1.0.0.jar.sha256
          python ore-retrogen/pin.py
          python ore-retrogen/pin.py --check
          python ore-retrogen/package.py
      - name: Save compiled server update
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ore-retrogen/adm-entry.json ore-retrogen/modpack-entries.json
          git add -u -- server/mods
          git add -f -- server/mods/empirecraft-ore-retrogen-1.1.0.jar* ore-retrogen/dist/*.zip ore-retrogen/dist/*.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Package one-time quartz deposits for existing chunks'
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Verify committed artifacts on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
