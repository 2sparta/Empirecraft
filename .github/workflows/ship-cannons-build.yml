name: Build and validate Ship Cannons
on:
  push:
    branches: ['codex/fix-land-cannon-recoil-20261029']
    paths: ['ship-cannons/**', '.github/workflows/ship-cannons-build.yml']
  pull_request:
    paths: ['ship-cannons/**', '.github/workflows/ship-cannons-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ship-cannons-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ship-cannons-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ship-cannons/
            /sails/build-inputs.json
            /sails/tools/CreateMappings.java
            /native-content/
            /server/libraries/
            /mods/
            /server/mods/
            /modpack-lock.json
            /seasonal-calendar/installed-mods.json
            /seasonal-calendar/audit/coverage.json
            /forging-balance/installed-client-mods.json
            /server/config/admanticheat/idfile/admanticheat_id_list.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the reported crashing JAR as a negative control
        run: |
          mkdir -p ship-cannons/build
          git fetch --no-tags --depth=1 origin 0ec456696117772a40a298b6d9d03b92da3029af
          git show 0ec456696117772a40a298b6d9d03b92da3029af:mods/empirecraft-ship-cannons-1.2.0.jar > ship-cannons/build/regression-1.2.0.jar
      - name: Build and test land, wheels, ships and shipped SRG linkage
        run: |
          set -o pipefail
          python3 ship-cannons/test.py | tee /tmp/ship-cannons-tests.log
      - name: Validate and package the tested release
        run: |
          python3 ship-cannons/release.py --apply
          python3 ship-cannons/release.py --apply --check
          python3 ship-cannons/update_installed.py
          python3 ship-cannons/tests/test_release.py
          python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          root=Path('ship-cannons')
          checks=[s for s in Path('/tmp/ship-cannons-tests.log').read_text().splitlines() if '_PASS' in s]
          digest=json.loads((root/'release.json').read_text())[0]['sha256']
          (root/'VALIDATION.txt').write_text('Empirecraft Ship Cannons 1.2.1\n\n'+'\n'.join(checks)+'\n\nSHA-256: '+digest+'\n\nNot run: a live Mohist/Towny world, graphical client or native physics simulation.\n')
          PYREPORT
          python3 ship-cannons/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Empirecraft-Ship-Cannons-1.2.1
          path: |
            ship-cannons/dist/Empirecraft-Ship-Cannons-1.2.1.zip
            ship-cannons/VALIDATION.txt
            ship-cannons/release.json
            mods/empirecraft-ship-cannons-1.2.1.jar*
            server/mods/empirecraft-ship-cannons-1.2.1.jar*
            modpack-lock.json
            seasonal-calendar/installed-mods.json
            seasonal-calendar/audit/coverage.json
            forging-balance/installed-client-mods.json
            server/config/admanticheat/idfile/admanticheat_id_list.json
            ship-cannons/build/*.log
            /tmp/ship-cannons-tests.log
          if-no-files-found: warn
