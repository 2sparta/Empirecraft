name: Verify Feudal politics, provisions and packages
on:
  push:
    branches: [codex/realtime-calendar-provisions, codex/towny-political-development]
    paths: ['feudal/**', 'seasonal-calendar/**', 'provisions/**', '.github/workflows/town-provisions.yml']
  pull_request:
    paths: ['feudal/**', 'provisions/**', 'server/plugins/empirecraft-feudal-*.jar*', '.github/workflows/town-provisions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provisions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  feudal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /layered-armor/dist/*.jar*
            /naval/dist/fleet-fixes-1.1/*.jar*
            /towny-recruits/dist/2.0.0/TownyRecruits.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /pack-fixes/
            /layered-armor/README.md
            /mods/empirecraft-layered-armor-*.jar*
            /server/mods/empirecraft-layered-armor-*.jar*
            /kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /server/kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /mods/empirecraft-pack-fixes-*.jar*
            /kubejs/data/minecraft/tags/
            /server/kubejs/data/minecraft/tags/
            /mods/empirecraft-seasonal-leaves-*.jar*
            /mods/empirecraft-towny-journeymap-*.jar*
            /server/mods/empirecraft-towny-journeymap-*.jar*
            /bridge/
            /feudal/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /provisions/
            /server/plugins/empirecraft-feudal-*.jar*
            /validation/politics-1.4.0.md
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 feudal/ci_build.py
      - run: python3 provisions/test.py
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify native Towny founding and 24-hour expansion provision guards
        run: python3 provisions/test_claims.py
      - name: Verify personal trade currency selection, quotes and native town commands
        run: python3 provisions/test_trade_towny.py
      - run: python3 feudal/package_politics.py
      - name: Check the committed reproducible plugin
        run: git diff --exit-code -- server/plugins/empirecraft-feudal-1.13.1.jar server/plugins/empirecraft-feudal-1.13.1.jar.sha256 feudal/dist
  package:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/codex/realtime-calendar-provisions' || github.ref == 'refs/heads/codex/towny-political-development') && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /layered-armor/dist/*.jar*
            /naval/dist/fleet-fixes-1.1/*.jar*
            /towny-recruits/dist/2.0.0/TownyRecruits.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /mods/empirecraft-towny-journeymap-*.jar*
            /server/mods/empirecraft-towny-journeymap-*.jar*
            /bridge/
            /feudal/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /provisions/
            /seasonal-calendar/
            /mods/empirecraft-calendar-*.jar*
            /server/mods/
            /server/libraries/
            /server/plugins/empirecraft-feudal-*.jar*
            /server/config/sereneseasons/
            /config/sereneseasons/
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /server/plugins/EmpirecraftFeudal/config.yml
            /modpack-lock.json
            /medieval-create/update_adm.py
            /world-rules/src/main/java/ua/empirecraft/worldrules/RulesConfig.java
            /validation/seasonal-calendar.json
            /validation/realtime-provisions.json
            /validation/politics-1.4.0.md
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify all existing finance tests and the new provision ledger
        run: |
          python3 feudal/ci_build.py
          python3 - <<'PY'
          from pathlib import Path
          for version in ['1.2.0', '1.3.0']:
              for suffix in ['', '.sha256']:
                  path=Path('server/plugins')/('empirecraft-feudal-'+version+'.jar'+suffix)
                  if path.exists():path.unlink()
          PY
          python3 provisions/test.py
      - name: Verify the real calendar against installed native classes
        if: github.ref != 'refs/heads/codex/towny-political-development'
        run: |
          python3 seasonal-calendar/make_data.py --jars server/mods
          python3 seasonal-calendar/build.py
          python3 seasonal-calendar/test.py
      - name: Refresh metadata and assemble verified overlays
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/codex/towny-political-development' ]; then
            python3 seasonal-calendar/update_metadata.py
          fi
          python3 seasonal-calendar/update_metadata.py --check
          python3 seasonal-calendar/update_adm.py --check --id-file server/config/admanticheat/idfile/admanticheat_id_list.json --jar mods/empirecraft-calendar-1.1.1.jar
          python3 seasonal-calendar/package.py
          python3 feudal/package_politics.py
          python3 provisions/package.py
          python3 - <<'PY'
          from pathlib import Path
          for directory,name in [('mods','empirecraft-calendar-1.0.0.jar'),('server/mods','empirecraft-calendar-1.0.0.jar'),('server/plugins','empirecraft-feudal-1.3.0.jar'),('provisions/dist','Empirecraft-Realtime-Provisions-1.0.0.zip')]:
              for suffix in ['', '.sha256']:
                  path=Path(directory)/(name+suffix)
                  if path.exists():path.unlink()
          PY
      - name: Commit verified binaries to this task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- mods server/mods server/plugins provisions/dist
          git add -- mods/empirecraft-calendar-1.1.1.jar mods/empirecraft-calendar-1.1.1.jar.sha256 server/mods/empirecraft-calendar-1.1.1.jar server/mods/empirecraft-calendar-1.1.1.jar.sha256 server/plugins/empirecraft-feudal-1.13.1.jar server/plugins/empirecraft-feudal-1.13.1.jar.sha256 modpack-lock.json server/config/admanticheat/idfile/admanticheat_id_list.json validation/seasonal-calendar.json validation/realtime-provisions.json seasonal-calendar/dist/Empirecraft-Seasonal-Calendar-1.1.1.zip seasonal-calendar/dist/Empirecraft-Seasonal-Calendar-1.1.1.zip.sha256 provisions/dist/Empirecraft-Realtime-Provisions-1.1.1.zip provisions/dist/Empirecraft-Realtime-Provisions-1.1.1.zip.sha256
          git add -f -- feudal/dist/EmpireCraft-Feudal-1.13.1-server.zip feudal/dist/EmpireCraft-Feudal-1.13.1-server.zip.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Package tested Feudal 1.4 politics, provisions and compatible overlays'
            git push origin HEAD:${{ github.ref_name }}
          fi
