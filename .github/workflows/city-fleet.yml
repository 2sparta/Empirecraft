name: City fleet and native Towny integration
on:
  pull_request:
    paths: ['naval/**', 'sails/**', 'feudal/**', 'bridge/**', 'mods/vs_sails-*', 'mods/empirecraft-towny-journeymap-*', 'server/plugins/empirecraft-feudal-*', '.github/workflows/city-fleet.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: city-fleet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /survival-overhaul/dist/Empirecraft-Survival-Update-1-sources.zip
            /survival-overhaul/dist/*.jar*
            /survival-overhaul/README.md
            /survival-overhaul/defaults/
            /mods/legendarysurvivaloverhaul-*.jar*
            /server/mods/legendarysurvivaloverhaul-*.jar*
            /layered-armor/dist/*.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /pack-fixes/
            /layered-armor/README.md
            /mods/empirecraft-layered-armor-*.jar*
            /server/mods/empirecraft-layered-armor-*.jar*
            /kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /server/kubejs/server_scripts/zzzzzzzz_empirecraft_stone_recipes.js
            /kubejs/data/minecraft/tags/
            /server/kubejs/data/minecraft/tags/
            /mods/empirecraft-seasonal-leaves-*.jar*
            /naval/
            /layered-armor/dist/*.zip*
            /engagement/
            /sails/
            /feudal/
            /bridge/
            /native-content/
            /mods/
            /server/mods/
            /server/discord-bot.env.example
            /server/plugins/Towny-0.101.2.0.jar
            /server/plugins/worldedit-bukkit-*.jar
            /server/plugins/multiverse-*.jar
            /server/plugins/PlaceholderAPI-*.jar
            /server/plugins/empirecraft-feudal-*.jar*
            /server/libraries/
            /server/defaultconfigs/
            /server/config/vs_sails/
            /server/config/admanticheat/idfile/
            /modpack-lock.json
            /validation/
            /ship-cannons/release.py
            /create-posters/dist/
            /seasonal-leaves/dist/1.3.1/
            /towny-recruits/dist/
            /disabled-mods/replaced-2026-11-01/
            /disabled-mods/startup-fixes-1/
            /ship-physics/
            /config/valkyrienskies/
            /defaultconfigs/valkyrienskies/
            /seasonal-calendar/installed-mods.json
            /seasonal-calendar/audit/coverage.json
            /forging-balance/installed-client-mods.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember the native server runtime
        run: echo "FLEET_RUNTIME_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the installed release and prepare the native compile API
        run: |
          python3 naval/release_update.py --check
          cp server/mods/vs_sails-1.20.1-0.3.2-empirecraft.19-forge.jar /tmp/fleet-production-sails.jar
          python3 sails/build.py --sails-only
          python3 sails/test.py
          # Exercise the exact committed release after compiling the source.
          cp /tmp/fleet-production-sails.jar server/mods/vs_sails-1.20.1-0.3.2-empirecraft.19-forge.jar
          cp /tmp/fleet-production-sails.jar mods/vs_sails-1.20.1-0.3.2-empirecraft.19-forge.jar
      - name: Exercise real ship ownership, port rights, UI, trade, auctions and restart
        run: python3 naval/smoke.py --plugin server/plugins/empirecraft-feudal-1.19.2.jar --bridge server/mods/empirecraft-towny-journeymap-1.11.0.jar --startup-plugins
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-fleet-runtime
          path: |
            naval/build/logs/
            naval/dist/
          if-no-files-found: error
