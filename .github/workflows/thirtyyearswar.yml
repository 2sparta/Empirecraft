name: Thirty Years War client integration
on:
  pull_request:
    paths: ['thirtyyearswar-integration/**', 'mods/epic-knights-thirty-years-war-*.jar', '.github/workflows/thirtyyearswar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tyw-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            launcher
            thirtyyearswar-integration
            kubejs
            mods
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install -r launcher/requirements.txt
      - name: Prepare the exact candidate overlay
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('thirtyyearswar-integration')
          overlay = root/'build/client-overlay'
          (overlay/'mods').mkdir(parents=True)
          for pattern in [
              'epic-knights-thirty-years-war-*.jar', 'empirecraft-casting-*.jar',
              'empirecraft-forging-*.jar', 'empirecraft-tfc-integration-*.jar',
              'medieval_boomsticks-*.jar', 'tfc_muskets-*.jar', 'TownyRecruits.jar',
              'recruits-1.20.1-*-empirecraft.*.jar',
          ]:
              matches = list(pathlib.Path('mods').glob(pattern))
              assert len(matches) == 1, pattern
              shutil.copy2(matches[0], overlay/'mods'/matches[0].name)
          for name, digest in json.loads((root/'audit/generated.json').read_text())['files'].items():
              source = pathlib.Path('kubejs')/name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
              target = overlay/'kubejs'/name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          for name in ['client_scripts/empirecraft_progression.js',
                       'startup_scripts/empirecraft_progression_tabs.js',
                       'server_scripts/zzzzzzzzzzzzz_empirecraft_gunsmith.js']:
              target = overlay/'kubejs'/name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(pathlib.Path('kubejs')/name, target)
      - name: Boot the full Potato client to the local menu
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          result=0
          xvfb-run -a python launcher/tools/runtime_smoke.py --boot-pack \
            --overlay thirtyyearswar-integration/build/client-overlay \
            --replace-mod-prefix epic-knights-thirty-years-war- \
            --replace-mod-prefix empirecraft-casting- \
            --replace-mod-prefix empirecraft-forging- \
            --replace-mod-prefix empirecraft-tfc-integration- \
            --replace-mod-prefix medieval_boomsticks- \
            --replace-mod-prefix tfc_muskets- \
            --replace-mod-prefix musketmod- \
            --replace-mod-prefix recruits-1.20.1- \
            > tyw-client.log 2>&1 || result=$?
          tail -200 tyw-client.log
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ThirtyYearsWar-client-validation
          path: tyw-client.log
          retention-days: 7
