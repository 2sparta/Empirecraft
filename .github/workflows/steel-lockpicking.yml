name: Steel lockpicking and saved-world upgrade
on:
  pull_request:
    paths: ['steel-lockpicking/**', 'mods/locks-steel-only-*.jar*', 'server/mods/locks-steel-only-*.jar*', 'locks-compat/**', '.github/workflows/steel-lockpicking.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: steel-lockpicking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /survival-overhaul/dist/*.jar*
            /layered-armor/dist/*.jar*
            /naval/dist/fleet-fixes-1.1/*.jar*
            /towny-recruits/dist/2.0.0/TownyRecruits.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /steel-lockpicking/
            /sails/
            /mods/
            /server/mods/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /server/defaultconfigs/locks-server.toml
            /validation/steel-lockpicking.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        id: runtime
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare native mappings and preserve shipped Sails
        run: |
          mkdir -p work/locks-sails-original
          cp mods/vs_sails-*.jar* work/locks-sails-original/
          python3 sails/build.py --sails-only
          cp work/locks-sails-original/* mods/
          cp work/locks-sails-original/* server/mods/
      - name: Rebuild, check sessions and upgrade actual saved locks with Towny
        run: |
          python3 steel-lockpicking/build.py
          python3 steel-lockpicking/test.py --java '${{ steps.runtime.outputs.path }}/bin/java'
          git diff --exit-code -- mods/locks-steel-only-*.jar* server/mods/locks-steel-only-*.jar* validation/steel-lockpicking.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: steel-lockpicking-validation
          path: |
            steel-lockpicking/build/native/
            steel-lockpicking/build/locks-steel-only-*.jar
            validation/steel-lockpicking.json
