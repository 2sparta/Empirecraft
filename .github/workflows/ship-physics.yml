name: Verify overboard water, heeling, flooding, mooring and ship damage
on:
  pull_request:
    paths: ['ship-physics/**', 'sails/**', 'mods/empirecraft-ship-physics-*', 'server/mods/empirecraft-ship-physics-*', 'config/valkyrienskies/**', 'defaultconfigs/valkyrienskies/**', 'server/defaultconfigs/valkyrienskies/**', 'server/world/serverconfig/valkyrienskies/**', '.github/workflows/ship-physics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ship-physics/
            /sails/
            /native-content/
            /ship-cannons/release.py
            /modpack-lock.json
            /seasonal-calendar/installed-mods.json
            /seasonal-calendar/audit/coverage.json
            /forging-balance/installed-client-mods.json
            /mods/
            /server/mods/
            /server/libraries/
            /server/config/admanticheat/idfile/
            /server/config/vs_sails/
            /config/valkyrienskies/
            /defaultconfigs/valkyrienskies/
            /server/defaultconfigs/
            /server/plugins/Towny-0.101.2.0.jar
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify committed client/server bytes, ADM and distributions
        run: |
          python3 ship-physics/release.py --check
          python3 sails/test_release_smooth.py
      - name: Compile source against the pinned installed runtime
        run: |
          python3 sails/build.py --sails-only
          python3 ship-physics/build.py
          python3 sails/test.py --prepare-safety-fixture
          python3 sails/test.py --prepare-sea-fixture --fixture-only
          python3 sails/test.py --prepare-flood-fixture --fixture-only
          python3 sails/test_flood_mixins.py
          python3 ship-physics/test.py
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise native large hull edits, radial damage and real Towny safety
        run: |
          python3 ship-physics/smoke.py
          python3 sails/safety_smoke.py
          python3 sails/sea_smoke.py
          python3 sails/sea_smoke.py --flooding
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ship-physics-diagnostics
          path: |
            ship-physics/build/*-logs/
            sails/build/safety-world-logs/
            sails/build/sea-world-logs/
            sails/build/flood-world-logs/
          if-no-files-found: ignore
