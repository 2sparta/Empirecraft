name: Verify recruit tactics
on:
  pull_request:
    paths: ['towny-recruits/**', '.github/workflows/recruit-tactics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recruit-tactics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tactics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /towny-recruits/
            /server/mods/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r towny-recruits/requirements-assets.txt
      - name: Prepare checksum-verified official client libraries
        run: python3 towny-recruits/tools/prepare_client.py --server server --output work/tactics-client
      - name: Compile the real mod and run server/client regressions
        run: |
          python3 towny-recruits/build.py --classpath-dir server --classpath-dir work/tactics-client
          python3 towny-recruits/test.py --classpath-dir server --classpath-dir work/tactics-client
          git diff --exit-code -- towny-recruits/dist/townyrecruits-1.2.0.jar towny-recruits/dist/townyrecruits-1.2.0.jar.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recruit-tactics-verification
          path: |
            towny-recruits/build/*.log
            work/tactics-client/remap.log
          if-no-files-found: warn
