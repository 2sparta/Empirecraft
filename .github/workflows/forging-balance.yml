name: Verify armor forging, gunpowder and calendar repair
on:
  pull_request:
    paths: ['forging-balance/**', 'mods/empirecraft-forging-*', 'server/mods/empirecraft-forging-*', '.github/workflows/forging-balance.yml']
  push:
    branches: [codex/forging-startup-fix-20261025, codex/chatplus-channels-20261025, codex/overgeared-quality-20261026, codex/epic-knights-content-20261026]
    paths: ['forging-balance/**', '.github/workflows/forging-balance.yml']
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native-content/
            /mods/
            /server/mods/
            /forging-balance/
            /chat-channels/dist/
            /translations/
            /seasonal-calendar/
            /ship-cannons/release.json
            /ore-retrogen/release.json
            /seasonal-leaves/release.json
            /recipe-whales/release.json
            /spawn-native/release.json
            /server/libraries/
            /modpack-lock.json
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /server/config/sereneseasons/
            /config/sereneseasons/
            /medieval-create/update_adm.py
            /world-rules/src/main/java/ua/empirecraft/worldrules/RulesConfig.java
            /validation/seasonal-calendar.json
            /validation/combat-armor-recruits.json
            /config/epicknights/
            /server/config/epicknights/
      # The final native overlay owns installed binaries and verifies retained rule/forging code.
      - name: Verify the final native overlay and preserved earlier features
        id: native
        run: |
          if [ -f native-content/inputs.json ]; then
            python3 native-content/test.py
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        if: steps.native.outputs.active != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify exact native classes on both physical sides
        if: steps.native.outputs.active != 'true'
        run: |
          python3 forging-balance/build.py
          python3 forging-balance/test.py
          python3 forging-balance/update_metadata.py
      - name: Verify deterministic installation artifacts
        if: steps.native.outputs.active != 'true' && (github.event_name == 'pull_request')
        run: |
          python3 forging-balance/package.py
          git diff --exit-code -- forging-balance mods/empirecraft-forging-1.1.1.jar mods/empirecraft-forging-1.1.1.jar.sha256 server/mods/empirecraft-forging-1.1.1.jar server/mods/empirecraft-forging-1.1.1.jar.sha256
      - name: Refresh the complete installed calendar and translation audits
        if: steps.native.outputs.active != 'true'
        run: |
          python3 seasonal-calendar/make_data.py ${{ github.event_name == 'pull_request' && '--check' || '' }} --jars server/mods --release ship-cannons/release.json --release ore-retrogen/release.json --release seasonal-leaves/release.json --release recipe-whales/release.json --release spawn-native/release.json
          python3 seasonal-calendar/build.py
          python3 seasonal-calendar/test.py
          python3 seasonal-calendar/update_metadata.py
          python3 forging-balance/update_metadata.py
          # Include the rebuilt calendar's actual hash in its own inventory audit.
          python3 seasonal-calendar/make_data.py ${{ github.event_name == 'pull_request' && '--check' || '' }} --jars server/mods --release ship-cannons/release.json --release ore-retrogen/release.json --release seasonal-leaves/release.json --release recipe-whales/release.json --release spawn-native/release.json
          python3 seasonal-calendar/build.py
          python3 seasonal-calendar/update_metadata.py --check
          python3 seasonal-calendar/package.py
          python3 forging-balance/package.py
          python3 forging-balance/refresh_shared_packages.py
          python3 translations/scan.py
          python3 translations/review.py
          python3 translations/build.py
      - name: Save audited packages
        if: steps.native.outputs.active != 'true' && (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- seasonal-calendar/audit/coverage.json seasonal-calendar/installed-mods.json seasonal-calendar/src/main/resources validation/seasonal-calendar.json translations/upstream translations/audit modpack-lock.json server/config/admanticheat/idfile/admanticheat_id_list.json forging-balance/audit forging-balance/installed-client-mods.json
          git add -u -- mods server/mods forging-balance/dist
          git add -f -- mods/empirecraft-forging-1.1.1.jar* server/mods/empirecraft-forging-1.1.1.jar* chat-channels/dist/*.zip chat-channels/dist/*.sha256
          git add -f -- seasonal-calendar/dist/*.zip seasonal-calendar/dist/*.sha256 translations/dist/*.zip translations/dist/*.sha256 forging-balance/dist/*.zip forging-balance/dist/*.sha256 mods/empirecraft-calendar-1.1.1.jar* server/mods/empirecraft-calendar-1.1.1.jar*
          if ! git diff --cached --quiet; then
            git commit -m 'Package Overgeared equipment update and refresh shared installation audits'
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Check refreshed audits on pull requests
        if: steps.native.outputs.active != 'true' && (github.event_name == 'pull_request')
        run: git diff --exit-code


