name: Smithing integration

on:
  pull_request:
    paths:
      - 'immersive-smithing/**'
      - 'mods/**'
      - 'server/mods/**'
      - 'server/kubejs/**'
      - '.github/workflows/smithing-integration.yml'

permissions:
  contents: read

jobs:
  installed-recipes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            immersive-smithing
            mods
            server/mods
            server/kubejs/startup_scripts
      - run: python3 immersive-smithing/check.py
