name: Generate translation drafts
on:
  push:
    branches: [codex/uk-ru-translations]
    paths: ['translations/bootstrap.py', '.github/workflows/translation-drafts.yml']
permissions:
  contents: write
jobs:
  drafts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout: translations
      - name: Generate cached drafts and Patchouli translations
        run: python3 -u translations/bootstrap.py
      - name: Save generated drafts for review
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf translations/__pycache__
          git add -f -- translations
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Ukrainian and Russian translation drafts for review'
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi
