name: Verify native recipe cleanup and whale loot
on:
  push:
    branches: [codex/native-recipes-whale-loot, codex/fix-nativepatch-packages]
    paths: ['recipe-whales/*.py', 'recipe-whales/*.java', 'recipe-whales/inputs.json', 'recipe-whales/whale-loot.json', 'recipe-whales/tests/**', '.github/workflows/recipe-whales.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recipe-whales-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    permissions:
      contents: write
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /recipe-whales/
            /medieval-create/
            /mods/
            /server/mods/
            /server/libraries/
            /server/config/admanticheat/idfile/
            /modpack-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Build native JAR patches and test every remaining recipe
        run: |
          python3 recipe-whales/tests/test_modules.py
          git fetch --no-tags --filter=blob:none --depth=1 origin 84f368498fd2c181aafa1a720bd239f61ec9ad6b
          python3 - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          shutil.copyfile('recipe-whales/audit/build.json', '/tmp/previous-whales-build.json')
          shutil.copyfile('recipe-whales/release.json', '/tmp/previous-whales-release.json')
          for row in json.loads(Path('recipe-whales/audit/build.json').read_text())['jars']:
              if not row['native_patch']:
                  continue
              for relative in row['paths']:
                  old = Path(relative).with_name(row['old_file'])
                  patched = old.with_name(row['file'])
                  patched.unlink(missing_ok=True)
                  patched.with_suffix('.jar.sha256').unlink(missing_ok=True)
                  with old.open('wb') as output:
                      subprocess.run(['git', 'show', '84f368498fd2c181aafa1a720bd239f61ec9ad6b:' + old.as_posix()], stdout=output, check=True)
          PY
          python3 recipe-whales/build.py --classpath-dir server/libraries
          python3 recipe-whales/test.py
      - name: Install both sides and update ADM hashes
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'recipe-whales')
          import build
          report = json.loads((build.ROOT/'audit/build.json').read_text())
          assert len(report['jars']) == 2
          assert {row['native_patch'] for row in report['jars']} == {'create', 'wonderoussea'}
          build.install(report)
          # Retain the audit/release history of every unrelated recipe patch.
          previous = json.loads(Path('/tmp/previous-whales-build.json').read_text())
          updated = {row['native_patch']: row for row in report['jars']}
          previous['jars'] = [updated.get(row['native_patch'], row) for row in previous['jars']]
          previous['checks'] = report['checks']
          previous['removed_recipes'].update(report['removed_recipes'])
          build.write(build.ROOT/'audit/build.json', previous)
          release = json.loads(Path('/tmp/previous-whales-release.json').read_text())
          updated = {row['replaces']: row for row in json.loads((build.ROOT/'release.json').read_text())}
          build.write(build.ROOT/'release.json', [updated.get(row['replaces'], row) for row in release])
          PY
      - name: Save verified JARs and matching integrity records on the fix branch
        if: github.ref == 'refs/heads/codex/fix-nativepatch-packages'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- mods/ server/mods/ recipe-whales/audit/build.json recipe-whales/release.json modpack-lock.json server/config/admanticheat/idfile/admanticheat_id_list.json
          if ! git diff --cached --quiet; then
            git commit -m 'Package native helpers in separate mod packages'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nativepatch-module-fix
          path: |
            recipe-whales/dist/create-1.20.1-6.0.8-medieval.4.jar*
            recipe-whales/dist/wonderoussea-1.0.4-empirecraft.2-forge-1.20.1.jar*
            recipe-whales/release.json
          if-no-files-found: error

