name: Verify currency market and native screens
on:
  push:
    branches: [codex/derived-kingdoms, codex/bombs-reserve-40s, codex/currency-market, codex/currency-exchange, codex/currency-screen-fixes, docs/towny-currency-ru-20261029]
    paths: ['feudal/**', 'bridge/**', '.github/workflows/currency-market.yml']
  pull_request:
    paths: ['feudal/**', 'bridge/**', '.github/workflows/currency-market.yml']
permissions:
  contents: read
concurrency:
  group: currency-market-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /layered-armor/dist/*.jar*
            /naval/dist/fleet-fixes-1.1/*.jar*
            /towny-recruits/dist/2.0.0/TownyRecruits.jar*
            /towny-recruits/vendor/townyrecruits-1.5.0.jar
            /feudal/
            /bridge/
            /mods/chatplus-forge-2.8.1-empirecraft.3.jar
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /modpack-lock.json
            /mods/empirecraft-towny-journeymap-*.jar*
            /server/plugins/empirecraft-feudal-*.jar*
            /server/mods/empirecraft-towny-journeymap-*.jar*
            /server/config/admanticheat/idfile/admanticheat_id_list.json
            /seasonal-calendar/installed-mods.json
            /seasonal-calendar/audit/coverage.json
            /forging-balance/installed-client-mods.json
            /validation/
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify ledger migration, physical payments, authority, locale grammar and all existing currency suites
        run: |
          mkdir -p feudal/lib work/currency-check
          cp server/plugins/Towny-0.101.2.0.jar feudal/lib/
          python3 feudal/build.py --server-api server/libraries/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-server.jar --api-libraries server/libraries --output-dir work/currency-check
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test native Minecraft screens and reobfuscate Forge bridge
        working-directory: bridge
        run: bash gradlew test build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-compatibility-build
          path: |
            work/currency-check/
            bridge/build/libs/
            bridge/build/reports/tests/
          if-no-files-found: warn
