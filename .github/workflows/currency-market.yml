name: Verify currency market and native screens
on:
  push:
    branches: [codex/bombs-reserve-40s, codex/currency-market, codex/currency-exchange, codex/currency-screen-fixes, docs/towny-currency-ru-20261029]
    paths: ['feudal/**', 'bridge/**', '.github/workflows/currency-market.yml']
  pull_request:
    paths: ['feudal/**', 'bridge/**', '.github/workflows/currency-market.yml']
permissions:
  contents: read
concurrency:
  group: currency-market-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          filter: blob:none
          sparse-checkout: |
            feudal
            bridge
            mods
            server/plugins
            server/mods
            server/config/admanticheat/idfile
            seasonal-calendar
            forging-balance
            provisions
            validation
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify ledger migration, physical payments, authority, locale grammar and all existing currency suites
        run: python3 feudal/build.py
      - name: Build and test native Minecraft screens and reobfuscate Forge bridge
        working-directory: bridge
        run: bash gradlew test build
      - name: Install identical bridge, update integrity metadata and package client/server overlays
        run: |
          python3 feudal/currency_release.py
          python3 feudal/package_politics.py
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Towny command routing and claims on the server runtime
        run: |
          java -cp 'feudal/build/classes:feudal/build/test-classes:feudal/lib/*' ua.empirecraft.feudal.TradeTownyTests
          java -cp 'feudal/build/classes:feudal/build/test-classes:feudal/lib/*' ua.empirecraft.feudal.ProvisionClaimTests
      - name: Preserve verified installation binaries and matching integrity metadata on the implementation branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'server/plugins/empirecraft-feudal-*.jar*' 'mods/empirecraft-towny-journeymap-*.jar*' 'server/mods/empirecraft-towny-journeymap-*.jar*' modpack-lock.json seasonal-calendar/installed-mods.json seasonal-calendar/audit/coverage.json server/config/admanticheat/idfile/admanticheat_id_list.json validation/currency-market-1.7.1.json forging-balance/installed-client-mods.json
          git add -A -f -- feudal/dist
          if ! git diff --cached --quiet; then
            git commit -m 'Package physical currency and localized commands with matching integrity records'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-market-1.7.1-build
          path: |
            validation/currency-market-1.7.1.json
            server/plugins/empirecraft-feudal-1.7.1.jar*
            bridge/build/libs/
            bridge/build/reports/tests/
            feudal/dist/Empirecraft-Currency-Market-1.7.1-*.zip*
          if-no-files-found: warn
