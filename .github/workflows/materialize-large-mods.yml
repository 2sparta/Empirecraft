name: Materialize large mod JARs

on:
  push:
    branches: [main, codex/empirecraft-mod-update]
    paths:
      - large-mods.json
      - tools/materialize_large_mods.py
      - .github/workflows/materialize-large-mods.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empirecraft-large-mods-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == '2sparta/Empirecraft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            .github
            tools
            mods
            server/mods
            large-mods.json
      - name: Download or reconstruct pinned JARs and verify checksums
        run: python3 tools/materialize_large_mods.py
      - name: Commit complete JARs and remove temporary parts
        run: |
          git add -- mods server/mods .github/mod-upload
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add verified large client and server mod JARs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
