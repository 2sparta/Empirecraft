name: Validate seasonal leaves
on:
  pull_request:
    paths: ['seasonal-leaves/**', '.github/workflows/seasonal-leaves.yml']
  push:
    paths: ['seasonal-leaves/**', '.github/workflows/seasonal-leaves.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seasonal-leaves/
            /server/libraries/
            /server/config/empirecraft_seasonal_leaves-common.toml
            /server/mods/SereneSeasons-*.jar
            /server/mods/GlitchCore-*.jar
            /server/mods/empirecraft-world-rules-1.0.2.jar
            /server/mods/empirecraft-calendar-*.jar
            /server/mods/empirecraft-no-end-1.0.0.jar
            /server/mods/combatlog-2.8.4-forge+1.20.1.jar
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile full source and verify checked-in JAR
        run: |
          python seasonal-leaves/test.py
          python seasonal-leaves/build.py
          git diff --exit-code -- seasonal-leaves/dist/1.2.3/empirecraft-seasonal-leaves-1.2.3.jar
          python seasonal-leaves/mixin_test.py
          python seasonal-leaves/build.py --prepare-fixture
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify admin-only growth switch across a real world restart
        run: python seasonal-leaves/growth_smoke.py
      - name: Compare 14k-entry scan queues and verify datapack cache invalidation
        run: python seasonal-leaves/performance_smoke.py
      - name: Verify install and source packages
        run: |
          python seasonal-leaves/package.py
          git diff --exit-code -- seasonal-leaves/dist/1.2.3/ seasonal-leaves/release.json
