name: City markets and native client
on:
  pull_request:
    paths: ['feudal/**', 'bridge/**', 'chat-channels/**', 'validation/check_localization.py', '.github/workflows/city-markets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: city-markets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /feudal/
            /bridge/
            /chat-channels/
            /translations/
            /server/plugins/LuckPerms-Bukkit-5.5.36.jar
            /server/plugins/empirecraft-chat-*.jar*
            /mods/
            /server/mods/
            /server/libraries/
            /server/plugins/Towny-0.101.2.0.jar
            /server/plugins/Towny/settings/
            /server/config/admanticheat/idfile/
            /server/config/contact/
            /sails/smoke-runtime.json
            /modpack-lock.json
            /native-content/inputs.json
            /native-content/retained-code.json
            /validation/
            /ship-cannons/release.py
            /create-posters/dist/
            /seasonal-leaves/dist/1.2.2/
            /towny-recruits/dist/
            /disabled-mods/replaced-2026-11-01/
            /seasonal-calendar/installed-mods.json
            /seasonal-calendar/audit/coverage.json
            /forging-balance/installed-client-mods.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile plugin and exercise every ledger suite
        run: |
          mkdir -p feudal/lib work/release
          cp server/plugins/Towny-0.101.2.0.jar feudal/lib/
          python3 feudal/build.py --server-api server/libraries/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-server.jar --api-libraries server/libraries --output-dir work/release | tee work/release/backend-tests.log
      - name: Verify localization and ChatPlus language/font layout repair
        run: |
          python3 validation/check_localization.py
          python3 -m pip install Pillow==11.3.0 PyYAML==6.0.3
          python3 chat-channels/build.py --feudal-jar work/release/empirecraft-feudal-1.13.2.jar | tee work/release/chat-build.log
          python3 chat-channels/test.py | tee work/release/chat-tests.log
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Build native forms against the real Forge client API and reobfuscate
        working-directory: bridge
        run: bash gradlew test build contactSmokeJar --no-daemon
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Deliver physical Contact postcards and verify receipts across a real server restart
        run: python3 feudal/contact_smoke.py
      - name: Verify both installed overlays, inventories and create the complete update ZIP
        run: |
          python3 feudal/city_release.py --plugin-jar work/release/empirecraft-feudal-1.13.2.jar --bridge-jar bridge/build/libs/empirecraft-towny-journeymap-1.8.1.jar --install --test-reports bridge/build/test-results/test --backend-log work/release/backend-tests.log --native-contact feudal/build/contact-native/result.json --chat-log work/release/chat-tests.log --output-dir work/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-markets-runtime
          path: |
            work/release/
            bridge/build/libs/
            bridge/build/reports/tests/
            feudal/build/contact-native/
          if-no-files-found: error
