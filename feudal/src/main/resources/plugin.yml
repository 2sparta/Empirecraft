name: EmpirecraftFeudal
version: 1.0.0
main: ua.empirecraft.feudal.FeudalPlugin
api-version: '1.20'
author: 2sparta
description: Українська феодальна система, васальні договори та державні валюти для Towny.
depend: [Towny]
softdepend: [Vault, Essentials]
commands:
  vassal:
    aliases: [васал, feudal]
    description: Васальні володіння та договори
    usage: /vassal help
    permission: empirecraft.feudal.use
  title:
    aliases: [титул]
    description: Політичні титули та грамоти
    usage: /title help
    permission: empirecraft.feudal.use
  wallet:
    aliases: [гаманець]
    description: Гаманець, валюти й скарбниці
    usage: /wallet help
    permission: empirecraft.feudal.use
permissions:
  empirecraft.feudal.use:
    description: Перегляд володінь та участь у системі з перевіркою посади
    default: true
  empirecraft.feudal.admin:
    description: Адміністративне виправлення васальних відносин і переказів
    default: op
