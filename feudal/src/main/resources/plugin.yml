name: EmpirecraftFeudal
version: 1.9.0
main: ua.empirecraft.feudal.FeudalPlugin
api-version: '1.20'
author: 2sparta
description: Українська феодальна система, васальні договори та державні валюти для Towny.
depend: [Towny]
softdepend: [Vault, Essentials]
commands:
  market:
    aliases: [ринок]
    description: Фізичні міські ринки, біржа, роботи та заставні позики
    usage: /market help
    permission: empirecraft.feudal.use
  statedebug:
    description: Адмінське відлагодження розвитку держав Towny
    usage: /statedebug help
    permission: empirecraft.feudal.debug
  trade:
    aliases: [торг]
    description: Обмін предметами та монетами між гравцями поруч
    permission: empirecraft.feudal.use
  order:
    aliases: [замовлення]
    description: Замовлення ресурсів із резервуванням оплати
    permission: empirecraft.feudal.use
  commerce:
    description: Перевірка незавершених передач предметів
    permission: empirecraft.feudal.use
  currency:
    aliases: [cu, валюта]
    description: Державні валюти з плаваючим золотим курсом
    usage: /currency help
    permission: empirecraft.feudal.use
  місто:
    description: Локалізовані команди Empirecraft
  город:
    description: Локалізовані команди Empirecraft
  нація:
    description: Локалізовані команди Empirecraft
  нация:
    description: Локалізовані команди Empirecraft
  житель:
    description: Локалізовані команди Empirecraft
  ділянка:
    description: Локалізовані команди Empirecraft
  участок:
    description: Локалізовані команди Empirecraft
  тауні:
    description: Локалізовані команди Empirecraft
  тауни:
    description: Локалізовані команди Empirecraft
  адмінміст:
    description: Локалізовані команди Empirecraft
  админгородов:
    description: Локалізовані команди Empirecraft
  світміст:
    description: Локалізовані команди Empirecraft
  миргородов:
    description: Локалізовані команди Empirecraft
  запрошення:
    description: Локалізовані команди Empirecraft
  приглашение:
    description: Локалізовані команди Empirecraft
  заказ:
    description: Локалізовані команди Empirecraft
  торгівля:
    description: Локалізовані команди Empirecraft
  торговля:
    description: Локалізовані команди Empirecraft
  налагодження:
    description: Локалізовані команди Empirecraft
  отладка:
    description: Локалізовані команди Empirecraft
permissions:
  empirecraft.feudal.debug:
    description: Примусова зміна політичних статусів та пропуск строків для тестування
    default: op
  empirecraft.feudal.castle.review:
    description: Незалежна перевірка споруд та державних установ
    default: op
  empirecraft.feudal.use:
    description: Перегляд володінь та участь у системі з перевіркою посади
    default: true
  empirecraft.feudal.admin:
    description: Адміністративне виправлення васальних відносин і переказів
    default: op






