name: EmpirecraftFeudal
version: 1.2.0
main: ua.empirecraft.feudal.FeudalPlugin
api-version: '1.20'
author: 2sparta
description: Українська феодальна система, васальні договори та державні валюти для Towny.
depend: [Towny]
softdepend: [Vault, Essentials]
commands:
  trade:
    aliases: [торгівля]
    description: Обмін предметами й монетами з гравцем поруч
    usage: /trade [гравець|accept|cancel|coins]
    permission: empirecraft.trade.use
  diplomacy:
    aliases: [дипломатія]
    description: Договори держав, підписи та історія
    usage: /diplomacy
    permission: empirecraft.feudal.use
  order:
    aliases: [замовлення, orders]
    description: Замовлення ресурсів із резервуванням оплати
    usage: /order
    permission: empirecraft.feudal.use
  dynasty:
    aliases: [династія]
    description: Династії, спадкоємці та зречення
    usage: /dynasty
    permission: empirecraft.feudal.use
  realmmap:
    aliases: [володіннямапа]
    description: Картки володінь і позначки JourneyMap
    usage: /realmmap
    permission: empirecraft.feudal.use
  vassal:
    aliases: [васал, feudal]
    description: Васальні володіння та договори
    usage: /vassal help
    permission: empirecraft.feudal.use
  title:
    aliases: [титул]
    description: Політичні титули та грамоти
    usage: /title help
    permission: empirecraft.feudal.use
  wallet:
    aliases: [гаманець]
    description: Гаманець, валюти й скарбниці
    usage: /wallet help
    permission: empirecraft.feudal.use
  currency:
    aliases: [валюта]
    description: Державні валюти з плаваючим золотим курсом
    usage: /currency help
    permission: empirecraft.feudal.use
  bank:
    aliases: [банк]
    description: Золоті рахунки та погашення монет
    usage: /bank help
    permission: empirecraft.feudal.use
  exchange:
    aliases: [обмін]
    description: Обмін валют через золоті резерви
    usage: /exchange help
    permission: empirecraft.feudal.use
permissions:
  empirecraft.trade.use:
    description: Обмін із двостороннім підтвердженням
    default: true
  empirecraft.feudal.use:
    description: Перегляд володінь та участь у системі з перевіркою посади
    default: true
  empirecraft.feudal.admin:
    description: Адміністративне виправлення васальних відносин і переказів
    default: op

