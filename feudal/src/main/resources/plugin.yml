name: EmpirecraftFeudal
version: 1.3.0
main: ua.empirecraft.feudal.FeudalPlugin
api-version: '1.20'
author: 2sparta
description: Українська феодальна система, васальні договори та державні валюти для Towny.
depend: [Towny]
softdepend: [Vault, Essentials]
commands:
  provision:
    aliases: [провізія]
    description: Міська провізія — також /t provision
    permission: empirecraft.feudal.use
  trade:
    aliases: [торг]
    description: Обмін предметами та монетами між гравцями поруч
    permission: empirecraft.feudal.use
  diplomacy:
    aliases: [дипломатія]
    description: Дипломатичні договори та історія підписів
    permission: empirecraft.feudal.use
  order:
    aliases: [замовлення]
    description: Замовлення ресурсів із резервуванням оплати
    permission: empirecraft.feudal.use
  dynasty:
    aliases: [династія]
    description: Правлячі доми, спадкоємці й передача влади
    permission: empirecraft.feudal.use
  estateinfo:
    aliases: [володіння]
    description: Картка володіння та позначки мапи
    permission: empirecraft.feudal.use
  commerce:
    description: Перевірка незавершених передач предметів
    permission: empirecraft.feudal.use
  vassal:
    aliases: [васал, feudal]
    description: Васальні володіння та договори
    usage: /vassal help
    permission: empirecraft.feudal.use
  title:
    aliases: [титул]
    description: Політичні титули та грамоти
    usage: /title help
    permission: empirecraft.feudal.use
  wallet:
    aliases: [гаманець]
    description: Гаманець, валюти й скарбниці
    usage: /wallet help
    permission: empirecraft.feudal.use
  currency:
    aliases: [валюта]
    description: Державні валюти з плаваючим золотим курсом
    usage: /currency help
    permission: empirecraft.feudal.use
  bank:
    aliases: [банк]
    description: Золоті рахунки та погашення монет
    usage: /bank help
    permission: empirecraft.feudal.use
  exchange:
    aliases: [обмін]
    description: Обмін валют через золоті резерви
    usage: /exchange help
    permission: empirecraft.feudal.use
permissions:
  empirecraft.feudal.use:
    description: Перегляд володінь та участь у системі з перевіркою посади
    default: true
  empirecraft.feudal.admin:
    description: Адміністративне виправлення васальних відносин і переказів
    default: op


