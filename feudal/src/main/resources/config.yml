# EmpirecraftFeudal 1.17.0 — Mohist 1.20.1 71a84ff7 / Towny 0.101.2.0.
# Для зміни періоду синхронізації та лімітів перезапустіть сервер.
sync-ticks: 600
discord:
  notifications:
    # Бот працює всередині JVM Minecraft. Без токена повідомлення лишаються в базі.
    enabled: false
    token-env: EMPIRECRAFT_DISCORD_BOT_TOKEN
    # Один адміністративний канал або окремі канали нижче. ID потрібно брати в лапки.
    # Якщо порожньо, використовується EMPIRECRAFT_DISCORD_ADMIN_CHANNEL_ID.
    channel-id: ''
    channels:
      castles: ''
      markets: ''
      ships: ''
    # Захист: ID Discord-серверів (guild), у яких дозволено публікацію.
    # Порожньо = дозволено будь-який сервер. Перед першим повідомленням у канал
    # бот перевіряє через API, що канал належить дозволеному серверу.
    allowed-guild-ids:
      - ''
trade:
  # Однаковий світ; перевірка на запит, прийняття, підтвердження та кожні 10 тіків.
  radius: 6
dynasty:
  # Реальні доби від останньої активності; 0 вимикає автоматичну передачу.
  # Під час першого встановлення відлік починається з поточного часу.
  inactivity-days: 30
hierarchy:
  max-children: 32
  max-depth: 12
contracts:
  proposal-hours: 48
  max-unpaid-periods: 2
  # Данина — раз на 7 реальних діб від підписання; гроші — із внутрішньої скарбниці.
  # Борг не видаляє міста. Періоди понад ліміт списуються з окремим записом журналу.
founding:
  # Максимальна відстань до центра найближчого привату рідної держави; 0 вимикає цей додатковий ліміт.
  # Власні земельні перевірки Towny діють завжди.
  max-distance-blocks: 2048


# Валюти 1.1: V=R/M; золото — окремий облік фізичних GOLD_INGOT, 12 знаків.
# BASE/Vault не перетворюється на золото; старі резерви погашаються в BASE.
# Комісія обміну — 0. Ставка обчислюється при кожній операції.


# Провізія: 8 одиниць поживності / Minecraft-чанк / реальну добу.
# Сезони: весна 1.0, літо 0.5, осінь 0.8, зима 1.5.
# Нові привати потребують запасу на наступні 24 години; столиця при заснуванні — виняток.
provisions:
  loss-after-hours: 48
  loss-every-hours: 12
  loss-fraction: 0.10
  collapse-after-hours: 96

# Новий розділ можна додати до наявного config.yml без заміни інших налаштувань.
# Після зміни значень потрібен повний перезапуск плагіна/сервера.
politics:
  hold-days: 7
  active-days: 30
  proposal-hours: 48
  election-hours: 48
  term-days: 30
  union-exit-days: 3
  grace-days: 7
  castle:
    scan-max-age-days: 1
    scans-per-sync: 2
  administration:
    # Центи валюти верховної держави (до її створення — BASE) за кожну прямо адміністровану провінцію на добу.
    # Сума переходить на службовий рахунок, не вилучається з золотого резерву.
    daily-cost-cents: 100
  population:
    settlement: 0
    barony: 5
    county: 10
    duchy: 20
    kingdom: 20
    empire: 50
    tribe: 3
    principality: 10
    horde: 10
    khanate: 20
    khaganate: 40
    central_state: 10
    central_kingdom: 20
    central_empire: 50
    free_city: 10
    trade_republic: 20
  requirements:
    castle-area: 144
    castle-wall-height: 4
    castle-score: 6
    castle-max-span: 64
    county-barons: 2
    duchy-counties: 2
    duchy-barons: 4
    kingdom-barons: 3
    kingdom-counties: 2
    kingdom-direct-towns: 3
    empire-kingdoms: 3
    tribal-towns: 2
    khanate-towns: 3
    khaganate-khanates: 3
    central-towns: 3
    central-empire-provinces: 3
    trade-republic-towns: 2
    absolutism-score: 75
    absolutism-direct-percent: 60
    election-quorum-percent: 50
    union-min-members: 3

# Local market defaults. Catalog entries are exact ItemStacks, never just material IDs.
markets:
  counter-radius: 6
  max-claims: 64
  max-deposits: 200
  catalog:
    - minecraft:iron_ingot
    - minecraft:gold_ingot
    - minecraft:copper_ingot
    - minecraft:diamond
    - minecraft:emerald
    - minecraft:coal
    - minecraft:charcoal
    - minecraft:stone
    - minecraft:cobblestone
    - minecraft:oak_log
    - minecraft:spruce_log
    - minecraft:wheat
    - minecraft:bread
    - minecraft:leather
    - minecraft:white_wool
