# EmpirecraftFeudal 1.2.0 — Mohist 1.20.1 71a84ff7 / Towny 0.101.2.0.
# Для зміни періоду синхронізації та лімітів перезапустіть сервер.
sync-ticks: 600
trade:
  # Однаковий світ; перевірка на запит, прийняття, підтвердження та кожні 10 тіків.
  radius: 6
dynasty:
  # Реальні доби від останньої активності; 0 вимикає автоматичну передачу.
  # Під час першого встановлення відлік починається з поточного часу.
  inactivity-days: 30
hierarchy:
  max-children: 32
  max-depth: 12
contracts:
  proposal-hours: 48
  max-unpaid-periods: 2
  # Данина — раз на 7 реальних діб від підписання; гроші — із внутрішньої скарбниці.
  # Борг не видаляє міста. Періоди понад ліміт списуються з окремим записом журналу.
founding:
  # Максимальна відстань до центра найближчого привату рідної держави; 0 вимикає цей додатковий ліміт.
  # Власні земельні перевірки Towny діють завжди.
  max-distance-blocks: 2048


# Валюти 1.1: V=R/M; золото — окремий облік фізичних GOLD_INGOT, 12 знаків.
# BASE/Vault не перетворюється на золото; старі резерви погашаються в BASE.
# Комісія обміну — 0. Ставка обчислюється при кожній операції.

